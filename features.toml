[[feature]]
id = "feature/sim-construction/project-control"
title = "Construction project control"
summary = "Describe construction phase gate and baseline control through as-of snapshot records, project charter identity, opportunity, bid/no-bid, customer-intent, collaboration charter, append-only fact books, lifecycle vocabulary, baselines, gates, actions, decisions, field observations/incidents/quality controls, design/RFI/review/release/permit/authority control, deterministic deltas, governance, capabilities, shared obligations, bounded exceptions, graph-composed blockers, readiness with reference-only evidence, and baseline-aware Gantt schedule impact."
owner = "crate/sim-lib-construction-project"
audiences = ["user", "code", "framework"]
guidance = "Use this row when starting a construction project-control record from stable ids, a charter, opportunity intake, customer intent with explicit unknowns, bid/no-bid or conditional-bid control, collaboration charter readiness, an append-only fact book, accepted baselines, accountable actions and decisions, production observations, deviations, incidents, inspection/test points, defects, corrective actions, design deliverables, RFIs, reviews, purpose-specific releases, permits, authority obligations, shared requirements and obligations, evidence states and validity windows, bounded construction exceptions, graph-composed blocker propagation, derived lifecycle gate reports, what-changed reports, organization-role governance, due-date and visibility policy, library-owned capabilities, evidence readiness before planning work depends on it, and control-to-Gantt joins that explain critical path, downstream, float-risk, late-decision, procurement lead-time, and change consequences without copying Gantt validation or placement logic. Customer assumptions and imported external items remain reported facts until accountable acceptance supplies evidence. BCF/IFC/CAD and field-system payloads stay in installed codecs/sites; project control records only minimized external references, effect references, control state, and decisions."
claims_anchors = [
  "anchor/crate/sim-lib-construction-project",
  "anchor/rustdoc/sim-lib-construction-project/crate-root",
]
claims_specimens = [
  "recipe/sim-construction/crates/sim-lib-construction-project/01-basics/mobilization-gate",
  "recipe/sim-construction/crates/sim-lib-construction-project/01-basics/mixed-obligation-gate",
  "recipe/sim-construction/crates/sim-lib-construction-project/01-basics/blocked-gate-graph",
  "recipe/sim-construction/crates/sim-lib-construction-project/01-basics/late-decision",
  "recipe/sim-construction/crates/sim-lib-construction-project/01-basics/customer-intent-to-collaboration",
  "recipe/sim-construction/crates/sim-lib-construction-project/01-basics/what-changed",
  "recipe/sim-construction/crates/sim-lib-construction-project/01-basics/design-release-to-production",
  "recipe/sim-construction/crates/sim-lib-construction-project/01-basics/work-package-award",
  "recipe/sim-construction/crates/sim-lib-construction-project/01-basics/control-graph-meets-gantt",
  "recipe/sim-construction/crates/sim-lib-construction-project/01-basics/six-week-production-readiness",
  "recipe/sim-construction/crates/sim-lib-construction-project/01-basics/sustainability-to-reference-evidence",
  "recipe/sim-construction/crates/sim-lib-construction-project/01-basics/field-item-to-corrective-evidence",
  "spec-test/sim-construction/crates/sim-lib-construction-project/src/opportunity_tests",
  "spec-test/sim-construction/crates/sim-lib-construction-project/src/fact_book_tests",
  "spec-test/sim-construction/crates/sim-lib-construction-project/src/design_tests",
  "spec-test/sim-construction/crates/sim-lib-construction-project/src/procurement_tests",
  "spec-test/sim-construction/crates/sim-lib-construction-project/src/production_plan_tests",
  "spec-test/sim-construction/crates/sim-lib-construction-project/src/schedule_tests",
  "spec-test/sim-construction/crates/sim-lib-construction-project/src/field_control_tests",
  "spec-test/sim-construction/crates/sim-lib-construction-project/src/tests",
]

[[feature]]
id = "feature/sim-construction/production-field-control"
title = "Construction production observations incidents quality and field-item control"
summary = "Control Dalux construction field item incident quality reports alongside local observations, deviations, inspection and test points, defects, and corrective actions with accountable evidence and safety-first rollups."
owner = "crate/sim-lib-construction-project"
audiences = ["user", "code", "framework"]
guidance = "Use this row when field reality must become traceable project facts. One shared field-control record carries severity, lane, responsible role, due date, affected control ids, state, non-waivable policy, and reference-only evidence. Rollups place imminent safety and work-environment blockers first, then active non-waivable controls without allowing lower severity to hide them. External imports are idempotent, changed source state supersedes the prior fact, and import remains Reported until corrective or inspection evidence is accepted by an accountable role."
claims_anchors = [
  "anchor/crate/sim-lib-construction-project",
  "anchor/rustdoc/sim-lib-construction-project/crate-root",
]
claims_specimens = [
  "recipe/sim-construction/crates/sim-lib-construction-project/01-basics/field-item-to-corrective-evidence",
  "spec-test/sim-construction/crates/sim-lib-construction-project/src/field_control_tests",
]

[[feature]]
id = "feature/sim-construction/gantt-schedule-impact"
title = "Gantt critical path construction schedule impact"
summary = "Join stable construction controls to canonical Gantt task ids and explain baseline-aware Gantt critical path construction consequences: downstream, need-date, float-risk, late-decision, procurement lead-time, and change impact."
owner = "crate/sim-lib-construction-project"
audiences = ["user", "code", "framework"]
guidance = "Use this row when construction project control needs schedule impact analysis from an accepted Gantt baseline. The construction crate owns only stable control-to-task joins, baseline revision checks, as-of sequence checks, and explanations; sim-lib-gantt owns plan validation, task dependency semantics, local snapshots, and critical-path calculation, while Powerproject placement remains in the site crate."
claims_anchors = [
  "anchor/crate/sim-lib-construction-project",
  "anchor/rustdoc/sim-lib-construction-project/crate-root",
]
claims_specimens = [
  "recipe/sim-construction/crates/sim-lib-construction-project/01-basics/control-graph-meets-gantt",
  "spec-test/sim-construction/crates/sim-lib-construction-project/src/schedule_tests",
]

[[feature]]
id = "feature/sim-construction/sustainability-reference-outcomes"
title = "Construction sustainability certification climate reuse outcomes"
summary = "Trace project-chartered certification, climate, efficiency, reuse, waste, responsible-material, quality, safety, work-environment, property, and city-district targets to source-retained quantities, method and boundary provenance, reviewed evidence, gate blockers, and admissible reference claims."
owner = "crate/sim-lib-construction-project"
audiences = ["user", "code", "framework"]
guidance = "Use this row when a construction project needs sustainability or place outcomes controlled from charter to evidence without a second ESG database, unit-conversion framework, calculator, certification engine, or material-system implementation. Certification schemes, calculation methods, material systems, and outcome categories remain open symbols with registered Shapes; specialist calculators own calculations, while SIM derives coverage, variance, overdue evidence, expired certificates, superseded records, reuse substitutions, and disclosure-safe reference admissibility."
claims_anchors = [
  "anchor/crate/sim-lib-construction-project",
  "anchor/rustdoc/sim-lib-construction-project/crate-root",
]
claims_specimens = [
  "recipe/sim-construction/crates/sim-lib-construction-project/01-basics/sustainability-to-reference-evidence",
  "spec-test/sim-construction/crates/sim-lib-construction-project/src/outcome_tests",
]

[[feature]]
id = "feature/sim-construction/production-lookahead-readiness"
title = "Construction lookahead production readiness"
summary = "Derive six-week demand and three-week production commitments from accepted Gantt task joins, work packages, location/system breakdowns, shared requirements, validity windows, accountable exceptions, and separate human commitment facts."
owner = "crate/sim-lib-construction-project"
audiences = ["user", "code", "framework"]
guidance = "Use this row when a project chief needs near-term executable work: production activities remain joined to canonical Gantt tasks, work packages, system, area, location, responsible role, planned interval, and accepted baseline; released design, permits, award/handoff, work preparation, risk assessment, method, material, equipment, staffing, competence, introduction, logistics, inspection plan, and predecessor work are shared requirements rather than planning booleans; commitment facts stay distinct from computed ready/not-ready/unknown results so weekly reliability can distinguish late evidence from bad commitments."
claims_anchors = [
  "anchor/crate/sim-lib-construction-project",
  "anchor/rustdoc/sim-lib-construction-project/crate-root",
]
claims_specimens = [
  "recipe/sim-construction/crates/sim-lib-construction-project/01-basics/six-week-production-readiness",
  "spec-test/sim-construction/crates/sim-lib-construction-project/src/production_plan_tests",
]

[[feature]]
id = "feature/sim-construction/risk-opportunity-forecast-escalation"
title = "Construction risk opportunity forecast escalation"
summary = "Control current project risks and opportunities through typed open ratings, method-bearing forecast consequences, exact comparable exposure, accepted Gantt joins, control dependencies, and deterministic attention recommendations."
owner = "crate/sim-lib-construction-project"
audiences = ["user", "code", "framework"]
guidance = "Use this row when uncertainty must stay traceable from cause, uncertain event, consequence, owner, response, trigger, due date, affected controls, and evidence through risk realization or opportunity capture. Qualitative and quantified ratings remain distinguishable under open schemes. Forecast time, exact Amount, safety, quality, environment, sustainability, people, place, and customer facts name their method and as-of basis. Exposure uses current facts and accepted baselines, groups only matching risk/opportunity kind, scenario, and currency, excludes parent/child double counting, and annotates correlation. Escalation recommends accountable attention for overdue response, crossed trigger, changed consequence, missing authority, or decision lead time; it never makes the decision."
claims_anchors = [
  "anchor/crate/sim-lib-construction-project",
  "anchor/rustdoc/sim-lib-construction-project/crate-root",
]
claims_specimens = [
  "recipe/sim-construction/crates/sim-lib-construction-project/01-basics/risk-to-project-chief-decision",
  "spec-test/sim-construction/crates/sim-lib-construction-project/src/risk_tests",
  "spec-test/sim-construction/crates/sim-lib-construction-project/src/exposure_tests",
  "spec-test/sim-construction/crates/sim-lib-construction-project/src/escalation_tests",
]

