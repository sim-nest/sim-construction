schema = "sim.features"

[enforcement.audience]
user = "strict"
code = "strict"
framework = "advisory"

[enforcement.surface]
cli = "strict"
docs = "advisory"
syntax = "strict"

[enforcement.specimen]
user = "strict"
framework = "strict"
code = "advisory"

[enforcement.route]
major_entrypoints = "advisory"
frameworks = "advisory"

[[feature]]
id = "feature/sim-construction/generated-docs"
title = "Repository documentation surface"
summary = "Publish generated package, card, recipe, and index facts for construction project-control crates."
owner = "crate/xtask"
audiences = ["code"]
guidance = "Use this row when checking the generated documentation and index lane for the construction repo."
claims_anchors = [
  "anchor/cli/xtask",
  "anchor/crate/xtask",
  "anchor/doc/generated/feature-map",
  "anchor/doc/generated/sim-index-fragment",
]
claims_surfaces = [
  "cli/xtask",
  "docs/sim-construction/generated",
]

[[feature]]
id = "feature/sim-construction/mspdi-schedule-exchange"
title = "MSPDI schedule exchange"
summary = "Round-trip Microsoft Project XML schedules through the portable construction Gantt document model."
owner = "crate/sim-codec-mspdi"
audiences = ["user", "code"]
guidance = "Use this row when importing or exporting construction schedules through the MSPDI XML exchange format."
claims_anchors = [
  "anchor/crate/sim-codec-mspdi",
  "anchor/export/sim-codec-mspdi/codec/mspdi",
  "anchor/grammar/syntax/mspdi",
]
claims_surfaces = [
  "syntax/mspdi",
]
claims_specimens = [
  "recipe/sim-construction/crates/sim-codec-mspdi/01-basics/mspdi-round-trip",
]

[[feature]]
id = "feature/sim-construction/powerproject-schedule-placement"
title = "Powerproject schedule placement"
summary = "Place construction Gantt schedules at Powerproject desktop and Project for the web boundaries."
owner = "crate/sim-site-powerproject"
audiences = ["user", "code", "framework"]
guidance = "Use this row when a construction schedule needs a modeled receipt, a gated Powerproject desktop export, or a reviewed Dataverse Project Schedule Service plan."
claims_anchors = [
  "anchor/crate/sim-site-powerproject",
  "anchor/export/sim-site-powerproject/site/powerproject",
  "anchor/rustdoc/sim-site-powerproject/crate-root",
]
claims_specimens = [
  "recipe/sim-construction/crates/sim-site-powerproject/01-basics/powerproject-placement",
]

[[feature]]
id = "feature/sim-construction/dalux-project-items"
title = "Dalux project-item placement"
summary = "Read Dalux project items into local office documents for construction evidence and keep note updates narrow."
owner = "crate/sim-site-dalux"
audiences = ["user", "code", "framework"]
guidance = "Use this row when construction project control needs modeled Dalux item evidence, a gated API-identity live read, or a narrow item-note update."
claims_anchors = [
  "anchor/crate/sim-site-dalux",
  "anchor/export/sim-site-dalux/site/dalux",
  "anchor/rustdoc/sim-site-dalux/crate-root",
]
claims_specimens = [
  "recipe/sim-construction/crates/sim-site-dalux/01-basics/dalux-modeled-items",
  "spec-test/sim-construction/crates/sim-site-dalux/src/tests",
]

[[feature]]
id = "feature/sim-construction/project-control"
title = "Construction project control"
summary = "Describe construction project charter identity, governance, capabilities, and readiness with reference-only evidence."
owner = "crate/sim-lib-construction-project"
audiences = ["user", "code", "framework"]
guidance = "Use this row when starting a construction project-control record from stable ids, a charter, organization-role governance, due-date and visibility policy, library-owned capabilities, and evidence readiness before planning work depends on it."
claims_anchors = [
  "anchor/crate/sim-lib-construction-project",
  "anchor/rustdoc/sim-lib-construction-project/crate-root",
]
claims_specimens = [
  "spec-test/sim-construction/crates/sim-lib-construction-project/src/tests",
]

[[route]]
id = "route/exchange-construction-schedule"
task = "Exchange a construction schedule"
audiences = ["user", "code"]
steps = [
  { feature = "feature/sim-construction/mspdi-schedule-exchange", why = "The MSPDI exchange row owns the XML codec and fidelity tests." },
  { specimen = "recipe/sim-construction/crates/sim-codec-mspdi/01-basics/mspdi-round-trip", why = "The round-trip recipe shows a modeled Gantt schedule crossing the MSPDI boundary." },
]

[[route]]
id = "route/place-construction-schedule-in-powerproject"
task = "Place a construction schedule in Powerproject"
audiences = ["user", "code", "framework"]
steps = [
  { feature = "feature/sim-construction/mspdi-schedule-exchange", why = "The MSPDI exchange row owns the portable schedule document crossing." },
  { feature = "feature/sim-construction/powerproject-schedule-placement", why = "The Powerproject row owns modeled receipts, gated desktop export, and Dataverse operation planning." },
  { specimen = "recipe/sim-construction/crates/sim-site-powerproject/01-basics/powerproject-placement", why = "The placement recipe shows the modeled OLE receipt and Project for the web operation set." },
]

[[route]]
id = "route/read-construction-items-from-dalux"
task = "Read construction field items from Dalux"
audiences = ["user", "code", "framework"]
steps = [
  { feature = "feature/sim-construction/dalux-project-items", why = "The Dalux row owns modeled item reads, API-identity live gating, response checks, and narrow note patches." },
  { specimen = "recipe/sim-construction/crates/sim-site-dalux/01-basics/dalux-modeled-items", why = "The modeled recipe shows synthetic Dalux items crossing into a local office document without live service access." },
]

[[route]]
id = "route/control-construction-project"
task = "Control a construction project"
audiences = ["user", "code", "framework"]
steps = [
  { feature = "feature/sim-construction/project-control", why = "The project-control row owns the identity, charter, governance, capability, visibility, and evidence readiness vocabulary." },
  { specimen = "recipe/sim-construction/crates/sim-lib-construction-project/01-basics/project-charter", why = "The project-charter recipe shows a synthetic accepted charter and governance record with reference-only evidence." },
]
