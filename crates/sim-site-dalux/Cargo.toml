[package]
name = "sim-site-dalux"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
description = "Dalux API-identity site placement for SIM construction records."
readme = "README.md"
publish = false
repository = "https://github.com/sim-nest/sim-construction"
homepage = "https://github.com/sim-nest/sim-construction"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sim-cookbook = { version = "0.2.0" }
sim-kernel = { version = "0.2.0" }
sim-lib-doc-core = { version = "0.1.0", git = "https://github.com/sim-nest/sim-office", rev = "6c0f3b6b39843b0947f48c90192dcf045d64978b" }
sim-lib-doc-site = { version = "0.1.0", git = "https://github.com/sim-nest/sim-office", rev = "6c0f3b6b39843b0947f48c90192dcf045d64978b" }
sim-lib-sheet = { version = "0.1.0", git = "https://github.com/sim-nest/sim-office", rev = "6c0f3b6b39843b0947f48c90192dcf045d64978b" }
ureq = "3"

[build-dependencies]
sim-cookbook = { version = "0.2.0" }

[dev-dependencies]
sim-codec = { version = "0.1.0" }
sim-codec-lisp = { version = "0.2.0" }
sim-codec-mspdi = { version = "0.1.0", path = "../sim-codec-mspdi" }
sim-kernel = { version = "0.2.0", features = ["test-support"] }
sim-ledger = { version = "0.1.0", git = "https://github.com/sim-nest/sim-ledger", rev = "be788aa4637ee0177a17ee69a89b68804cb37ffa" }
sim-lib-construction-office = { version = "0.1.0", path = "../sim-lib-construction-office" }
sim-lib-construction-project = { version = "0.1.0", path = "../sim-lib-construction-project" }
sim-lib-gantt = { version = "0.1.0", git = "https://github.com/sim-nest/sim-office", rev = "6c0f3b6b39843b0947f48c90192dcf045d64978b" }
sim-site-powerproject = { version = "0.1.0", path = "../sim-site-powerproject" }
sim-table-hash = { version = "0.1.3" }
time = "0.3"
toml = "1.1"

[lints]
workspace = true
