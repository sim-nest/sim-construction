[package]
name = "sim-lib-construction-office"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
description = "Visibility-safe office evidence and role-pack projections for SIM construction control."
readme = "README.md"
publish = false
repository = "https://github.com/sim-nest/sim-construction"
homepage = "https://github.com/sim-nest/sim-construction"

[dependencies]
sim-cookbook = { version = "0.4.0" }
sim-kernel = { version = "0.4.0" }
sim-lib-construction-project = { version = "0.1.0", path = "../sim-lib-construction-project" }
sim-lib-deck = { version = "0.1.0", git = "https://github.com/sim-nest/sim-office", rev = "bb8279c1bcbfe14aac8abe75f4bb03f14d29480c" }
sim-lib-doc-core = { version = "0.2.0", git = "https://github.com/sim-nest/sim-office", rev = "bb8279c1bcbfe14aac8abe75f4bb03f14d29480c" }
sim-lib-doc-surface = { version = "0.1.0", git = "https://github.com/sim-nest/sim-office", rev = "bb8279c1bcbfe14aac8abe75f4bb03f14d29480c" }
sim-lib-doc-store = { version = "0.2.0", git = "https://github.com/sim-nest/sim-office", rev = "bb8279c1bcbfe14aac8abe75f4bb03f14d29480c" }
sim-lib-sheet = { version = "0.1.0", git = "https://github.com/sim-nest/sim-office", rev = "bb8279c1bcbfe14aac8abe75f4bb03f14d29480c" }
sim-value = { version = "0.4.0" }
thiserror = "1"
time = "0.3"

[build-dependencies]
sim-cookbook-build = { version = "0.2.0" }

[dev-dependencies]
sim-kernel = { version = "0.4.0", features = ["test-support"] }
tempfile = "3"

[lints]
workspace = true
