[package]
name = "sim-site-powerproject"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
description = "Powerproject and Project for the web site placement for SIM Gantt documents."
readme = "README.md"
publish = false
repository = "https://github.com/sim-nest/sim-construction"
homepage = "https://github.com/sim-nest/sim-construction"

[dependencies]
sim-codec-mspdi = { version = "0.1.0", path = "../sim-codec-mspdi" }
sim-cookbook = { version = "0.4.0" }
sim-kernel = { version = "0.4.0" }
sim-lib-doc-core = { version = "0.2.0", git = "https://github.com/sim-nest/sim-office", rev = "bb8279c1bcbfe14aac8abe75f4bb03f14d29480c" }
sim-lib-doc-site = { version = "0.1.0", git = "https://github.com/sim-nest/sim-office", rev = "bb8279c1bcbfe14aac8abe75f4bb03f14d29480c" }
sim-lib-gantt = { version = "0.1.0", git = "https://github.com/sim-nest/sim-office", rev = "bb8279c1bcbfe14aac8abe75f4bb03f14d29480c" }

[build-dependencies]
sim-cookbook-build = { version = "0.2.0" }

[dev-dependencies]
time = "0.3"

[lints]
workspace = true
