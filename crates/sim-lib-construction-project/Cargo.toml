[package]
name = "sim-lib-construction-project"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
description = "Construction project-control records for SIM."
readme = "README.md"
publish = false
repository = "https://github.com/sim-nest/sim-construction"
homepage = "https://github.com/sim-nest/sim-construction"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sim-citizen = { version = "0.4.0" }
sim-codec = { version = "0.3.0" }
sim-codec-json = { version = "0.4.0" }
sim-cookbook = { version = "0.4.0" }
sim-kernel = { version = "0.4.0" }
sim-ledger = { version = "0.1.0", git = "https://github.com/sim-nest/sim-ledger", rev = "a9a376f1376a19f153011e29257f9af7465a323f" }
sim-lib-discrete-graph = { version = "0.4.0" }
sim-lib-doc-core = { version = "0.2.0", git = "https://github.com/sim-nest/sim-office", rev = "bb8279c1bcbfe14aac8abe75f4bb03f14d29480c" }
sim-lib-gantt = { version = "0.1.0", git = "https://github.com/sim-nest/sim-office", rev = "bb8279c1bcbfe14aac8abe75f4bb03f14d29480c" }
sim-shape = { version = "0.4.0" }
sim-table-core = { version = "0.3.0" }
sim-value = { version = "0.4.0" }
thiserror = "1"
time = { version = "0.3", features = ["serde", "serde-human-readable"] }

[build-dependencies]
sim-cookbook-build = { version = "0.2.0" }

[dev-dependencies]
sim-codec-binary = { version = "0.4.0" }
sim-codec-lisp = { version = "0.4.0" }
sim-kernel = { version = "0.4.0", features = ["test-support"] }
sim-lib-binding = { version = "0.3.0" }
sim-lib-numbers-i64 = { version = "0.5.0" }
sim-run-core = { version = "0.5.0" }
sim-table-hash = { version = "0.1.3" }

[lints]
workspace = true
