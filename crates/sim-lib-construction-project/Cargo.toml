[package]
name = "sim-lib-construction-project"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
description = "Construction project-control records for SIM."
readme = "README.md"
publish = false
repository = "https://github.com/sim-nest/sim-construction"
homepage = "https://github.com/sim-nest/sim-construction"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sim-citizen = { version = "0.2.0" }
sim-codec = { version = "0.1.0" }
sim-codec-json = { version = "0.2.0" }
sim-cookbook = { version = "0.2.0" }
sim-kernel = { version = "0.2.0" }
sim-ledger = { version = "0.1.0", git = "https://github.com/sim-nest/sim-ledger", rev = "be788aa4637ee0177a17ee69a89b68804cb37ffa" }
sim-lib-discrete-graph = { version = "0.2.0", git = "https://github.com/sim-nest/sim-discrete", rev = "4dbec61654cc73d7963da6c03ebb632b5b7e0eaa" }
sim-lib-doc-core = { version = "0.1.0", git = "https://github.com/sim-nest/sim-office", rev = "6c0f3b6b39843b0947f48c90192dcf045d64978b" }
sim-lib-gantt = { version = "0.1.0", git = "https://github.com/sim-nest/sim-office", rev = "6c0f3b6b39843b0947f48c90192dcf045d64978b" }
sim-shape = { version = "0.2.0" }
sim-table-core = { version = "0.1.2" }
sim-value = { version = "0.2.0" }
thiserror = "2"
time = { version = "0.3", features = ["serde", "serde-human-readable"] }

[build-dependencies]
sim-cookbook = { version = "0.2.0" }

[dev-dependencies]
sim-codec-binary = { version = "0.2.0" }
sim-codec-lisp = { version = "0.2.0" }
sim-kernel = { version = "0.2.0", features = ["test-support"] }
sim-lib-binding = { version = "0.1.2" }
sim-lib-numbers-i64 = { version = "0.3.1" }
sim-run-core = { version = "0.3.0" }
sim-table-fs = { version = "0.1.3" }
sim-table-hash = { version = "0.1.3" }

[lints]
workspace = true
