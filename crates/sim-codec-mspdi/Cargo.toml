[package]
name = "sim-codec-mspdi"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
description = "MSPDI schedule codec for SIM construction Gantt documents."
readme = "README.md"
publish = false
repository = "https://github.com/sim-nest/sim-construction"
homepage = "https://github.com/sim-nest/sim-construction"

[dependencies]
roxmltree = "0.21"
sim-cookbook = { version = "0.1.0" }
sim-kernel = { version = "0.1.0" }
sim-lib-doc-core = { version = "0.1.0", git = "https://github.com/sim-nest/sim-office", rev = "eb617e4fd3c50fc51bcdb6a11ea5a8bbae4d1a48" }
sim-lib-gantt = { version = "0.1.0", git = "https://github.com/sim-nest/sim-office", rev = "2c76395bf66978822210f2397a03482b1f429da8" }
time = "0.3"

[build-dependencies]
sim-cookbook = { version = "0.1.0" }

[lints]
workspace = true
