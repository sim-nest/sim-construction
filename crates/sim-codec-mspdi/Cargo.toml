[package]
name = "sim-codec-mspdi"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
description = "MSPDI schedule codec for SIM construction Gantt documents."
readme = "README.md"
publish = false
repository = "https://github.com/sim-nest/sim-construction"
homepage = "https://github.com/sim-nest/sim-construction"

[dependencies]
roxmltree = "0.21"
sim-cookbook = { version = "0.2.0" }
sim-kernel = { version = "0.2.0" }
sim-lib-doc-core = { version = "0.1.0", git = "https://github.com/sim-nest/sim-office", rev = "6c0f3b6b39843b0947f48c90192dcf045d64978b" }
sim-lib-gantt = { version = "0.1.0", git = "https://github.com/sim-nest/sim-office", rev = "6c0f3b6b39843b0947f48c90192dcf045d64978b" }
time = "0.3"

[build-dependencies]
sim-cookbook = { version = "0.2.0" }

[lints]
workspace = true
